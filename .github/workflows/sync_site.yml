name: Sync to leanbitlab.github.io

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    if: github.repository == 'LeanBitLab/LeanBitLab'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push to leanbitlab.github.io
        env:
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git checkout -B deploy
          git rm -rf .github
          git commit -m "deploy: sync from LeanBitLab"
          git config --local --unset-all "http.https://github.com/.extraheader" || true
          git remote add target "https://${SYNC_PAT}@github.com/LeanBitLab/leanbitlab.github.io.git" 2>/dev/null || git remote set-url target "https://${SYNC_PAT}@github.com/LeanBitLab/leanbitlab.github.io.git"
          git -c http.https://github.com/.extraheader="" push target deploy:main --force
