name: Update README Badges

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight UTC
  workflow_dispatch: # Allows manual trigger

jobs:
  update-badge:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run update script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPONSORS_TOKEN: ${{ secrets.SPONSORS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python .github/scripts/update_downloads.py

      - name: Commit and push if changed
        env:
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md stats.svg stats.json index.html website.svg sponsor.svg sponsor-data.js
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "auto: update README badges, stats card & site stats"
            git push
            if [ -n "$SYNC_PAT" ]; then
              git remote add target "https://${SYNC_PAT}@github.com/LeanBitLab/leanbitlab.github.io.git" || true
              git -c http.extraheader="" push target main --force
            fi
          fi
