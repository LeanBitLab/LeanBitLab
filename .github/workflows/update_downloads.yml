name: Update README Badges

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight UTC
  workflow_dispatch: # Allows manual trigger

jobs:
  update-badge:
    if: github.repository == 'LeanBitLab/LeanBitLab'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      LEDGER_TOKEN: ${{ secrets.LEDGER_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Real sponsor amounts live in a private repo, never in this public one. Without LEDGER_TOKEN the
      # script skips All Time total updates.
      - name: Check out private sponsor ledger
        if: env.LEDGER_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: LeanBitLab/sponsor-ledger
          token: ${{ secrets.LEDGER_TOKEN }}
          path: sponsor-ledger

      - name: Run update script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPONSORS_TOKEN: ${{ secrets.SPONSORS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python .github/scripts/update_downloads.py

      - name: Save sponsor ledger
        if: env.LEDGER_TOKEN != ''
        working-directory: sponsor-ledger
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          python3 ../.github/scripts/ledger_readme.py .
          git add ledger.json README.md
          if ! git diff --staged --quiet; then
            git commit -m "auto: update sponsor totals"
            git push
          fi

      - name: Commit and push if changed
        env:
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md stats.svg stats.json index.html website.svg sponsor.svg sponsor-data.js opencollective-data.json
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "auto: update README badges, stats card & site stats"
            git push
            if [ -n "$SYNC_PAT" ]; then
              git checkout -B deploy
              git rm -rf .github/workflows .github/scripts
              git commit -m "deploy: update stats from LeanBitLab"
              git config --local --unset-all "http.https://github.com/.extraheader" || true
              git remote add target "https://${SYNC_PAT}@github.com/LeanBitLab/leanbitlab.github.io.git" 2>/dev/null || git remote set-url target "https://${SYNC_PAT}@github.com/LeanBitLab/leanbitlab.github.io.git"
              git -c http.https://github.com/.extraheader="" push target deploy:main --force
            fi
          fi
